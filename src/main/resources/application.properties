spring.application.name=campuspath

# --- Database (MySQL / XAMPP MariaDB) ---
# Each teammate can override these without editing this file:
#   - set environment variables DB_URL, DB_USERNAME, DB_PASSWORD, or
#   - create local.properties in the project root (git-ignored; see local.properties.example)
spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campuspath_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create/update tables from the @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
