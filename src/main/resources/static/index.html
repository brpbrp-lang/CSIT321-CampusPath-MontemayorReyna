<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#800020">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>CampusPath | CIT-U Campus Navigation</title>
    <meta name="description" content="Find buildings, classrooms and offices around CIT-U and get walking directions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>
    <!-- Splash (shown briefly on launch) -->
    <div id="splash" class="splash" aria-hidden="true">
        <div>
            <div class="brand-mark" data-icon="map"></div>
            <h1>CampusPath</h1>
            <p>Find Your Way Around CIT-U</p>
        </div>
    </div>

    <div id="app">
        <div id="offlineBar" class="offline-bar" hidden>
            <span id="offlineText">Can't reach the CampusPath server.</span><button type="button" id="retryBtn">Retry</button>
        </div>

        <!-- Each screen is rendered here by js/app.js (hash routes like #/home, #/map).
             Phones: full-screen pages. Computers: a side panel over the map. -->
        <main id="screen" aria-live="polite"></main>

        <nav id="tabbar" class="tabbar" aria-label="Main">
            <a class="tab" href="#/home" data-tab="home"><span data-icon="home"></span>Home</a>
            <a class="tab" href="#/map" data-tab="map"><span data-icon="map"></span>Map</a>
            <a class="tab" href="#/search" data-tab="search"><span data-icon="search"></span>Search</a>
            <a class="tab" href="#/profile" data-tab="profile"><span data-icon="user"></span>Profile</a>
        </nav>
    </div>

    <!-- Computers: the campus map fills the window behind the side panel -->
    <div id="mapStage"></div>

    <!-- The campus map, drawn once. js/app.js places it: in the background on computers,
         inside the Map / Details / Directions pages on phones. Buildings, walkways and pins are added by js/map.js. -->
    <div id="mapParking" hidden>
        <div id="mapViewport">
                <svg id="campusSvg" class="campus-svg" viewBox="0 0 1400 950" preserveAspectRatio="xMinYMin meet" role="img" aria-label="CIT-U campus map">
                    <defs>
                        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
                        </filter>
                        <filter id="pinShadow" x="-40%" y="-40%" width="180%" height="180%">
                            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28"/>
                        </filter>
                        <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e8eef5"/>
                            <stop offset="50%" stop-color="#eef3f8"/>
                            <stop offset="100%" stop-color="#e2e9f0"/>
                        </linearGradient>
                        <linearGradient id="maroonRoof" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#991b1b"/>
                            <stop offset="100%" stop-color="#800000"/>
                        </linearGradient>
                        <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fcd34d"/>
                            <stop offset="100%" stop-color="#f5b800"/>
                        </linearGradient>
                        <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.6" stroke-opacity="0.45"/>
                        </pattern>
                    </defs>

                    <g id="mapWorld">
                        <!-- Base Campus Ground -->
                        <rect x="-400" y="-400" width="2200" height="1750" fill="url(#groundGrad)"/>
                        <rect x="-400" y="-400" width="2200" height="1750" fill="url(#gridPattern)"/>

                        <!-- CIT-U campus grounds, traced from the official Campus Directory sign (north is up) -->
                        <g id="campusRoads" pointer-events="none">
                            <!-- Campus grounds (first polygon: the mobile view frames the map on it) -->
                            <polygon points="292,30 735,30 735,112 1000,112 1000,280 1110,280 1110,908 292,908" fill="#dde3ea" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
                            <!-- River along the west side -->
                            <path d="M 270 20 C 262 220, 284 420, 272 620 S 266 860, 280 940" fill="none" stroke="#93c5fd" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
                            <!-- Inner quadrangle (courts, pavilion, open grounds) -->
                            <rect x="505" y="178" width="400" height="392" rx="18" fill="#e9edf2"/>
                            <!-- Green spaces -->
                            <rect x="292" y="250" width="8" height="620" fill="#bbe5c8"/>
                            <rect x="660" y="352" width="30" height="86" rx="10" fill="#cdebd6"/>
                            <rect x="1035" y="440" width="70" height="320" rx="14" fill="#cdebd6"/>
                            <rect x="868" y="400" width="36" height="160" rx="10" fill="#cdebd6"/>
                            <!-- N. Bacalso Avenue (main entrance) -->
                            <path d="M 240 930 L 1160 930" stroke="#cbd5e1" stroke-width="30" stroke-linecap="round"/>
                            <text x="700" y="934" text-anchor="middle" class="road-label">N. BACALSO AVENUE</text>
                            <text x="1065" y="918" text-anchor="middle" class="road-label" style="font-size:8px;letter-spacing:0.08em">MAIN GATE</text>
                        </g>

                        <!-- Covered walkways (drawn by map.js from the walkway network used for directions) -->
                        <g id="walkwayLayer" pointer-events="none"></g>

                        <!-- Trees & campus landscaping -->
                        <g id="campusTrees" pointer-events="none">
                            <circle cx="672" cy="372" r="9" fill="#4ade80" opacity="0.8"/>
                            <circle cx="678" cy="415" r="8" fill="#22c55e" opacity="0.8"/>
                            <circle cx="1060" cy="470" r="11" fill="#4ade80" opacity="0.8"/>
                            <circle cx="1080" cy="540" r="9" fill="#22c55e" opacity="0.8"/>
                            <circle cx="1058" cy="620" r="11" fill="#4ade80" opacity="0.8"/>
                            <circle cx="1082" cy="700" r="9" fill="#22c55e" opacity="0.8"/>
                            <circle cx="884" cy="430" r="8" fill="#4ade80" opacity="0.8"/>
                            <circle cx="886" cy="520" r="8" fill="#22c55e" opacity="0.8"/>
                            <circle cx="296" cy="300" r="7" fill="#22c55e" opacity="0.7"/>
                            <circle cx="296" cy="520" r="7" fill="#4ade80" opacity="0.7"/>
                            <circle cx="296" cy="760" r="7" fill="#22c55e" opacity="0.7"/>
                        </g>

                        <!-- 2.5D Isometric Building Footprints (rendered & enhanced by map.js) -->
                        <g id="buildingsLayer"></g>

                        <!-- Active Building Floor Plan Overlay (when inspecting 1F/2F/3F) -->
                        <g id="floorPlanLayer"></g>

                        <!-- Route Guidance Polyline Layer -->
                        <g id="routeLayer"></g>

                        <!-- Color-Coded Location Pins Layer -->
                        <g id="pinsLayer"></g>
                    </g>
                </svg>
            <div id="floorSwitcher" class="floor-switcher hidden" aria-label="Floor">
                <div class="floor-building-tag" id="floorBuildingLabel">NGE</div>
                <button class="floor-btn" data-floor="4">4F</button>
                <button class="floor-btn" data-floor="3">3F</button>
                <button class="floor-btn" data-floor="2">2F</button>
                <button class="floor-btn active" data-floor="1">1F</button>
            </div>
            <div class="map-controls">
                <button id="zoomInBtn" type="button" aria-label="Zoom in">+</button>
                <button id="zoomOutBtn" type="button" aria-label="Zoom out">&minus;</button>
                <button id="fitCampusBtn" type="button" aria-label="Show whole campus">&#8982;</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
