<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#800020">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>CampusPath | CIT-U Campus Navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <!-- Splash (shown briefly on launch) -->
    <div id="splash" class="splash" aria-hidden="true">
        <div>
            <div class="brand-mark" data-icon="map"></div>
            <h1>CampusPath</h1>
            <p>Find Your Way Around CIT-U</p>
        </div>
    </div>

    <div id="app">
        <div id="offlineBar" class="offline-bar" hidden>
            Can't reach the CampusPath server.<button type="button" id="retryBtn">Retry</button>
        </div>

        <!-- Each screen is rendered here by js/mobile.js (hash routes like #/home, #/map) -->
        <main id="screen" aria-live="polite"></main>

        <nav id="tabbar" class="tabbar" aria-label="Main">
            <a class="tab" href="#/home" data-tab="home"><span data-icon="home"></span>Home</a>
            <a class="tab" href="#/map" data-tab="map"><span data-icon="map"></span>Map</a>
            <a class="tab" href="#/search" data-tab="search"><span data-icon="search"></span>Search</a>
            <a class="tab" href="#/profile" data-tab="profile"><span data-icon="user"></span>Profile</a>
        </nav>
    </div>

    <!-- The one shared campus map. js/mobile.js copies the map drawing from index.html into it
         and moves it into whichever screen needs a map (Map, Details, Directions, Navigation). -->
    <div id="mapParking" hidden>
        <div id="mapViewport">
            <div id="floorSwitcher" class="floor-switcher hidden" aria-label="Floor">
                <div class="floor-building-tag" id="floorBuildingLabel">NGE</div>
                <button class="floor-btn" data-floor="4">4F</button>
                <button class="floor-btn" data-floor="3">3F</button>
                <button class="floor-btn" data-floor="2">2F</button>
                <button class="floor-btn active" data-floor="1">1F</button>
            </div>
            <div class="map-controls">
                <button id="zoomInBtn" type="button" aria-label="Zoom in">+</button>
                <button id="zoomOutBtn" type="button" aria-label="Zoom out">&minus;</button>
                <button id="fitCampusBtn" type="button" aria-label="Show whole campus">&#8982;</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/map.js"></script>
    <script src="js/mobile.js"></script>
</body>
</html>
