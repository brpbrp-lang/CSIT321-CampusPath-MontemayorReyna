# Test settings: an in-memory H2 database (MySQL mode) instead of the real MySQL server.
# The DataSeeder fills it with the same sample data as dummy_data.md.
spring.application.name=campuspath
spring.datasource.url=jdbc:h2:mem:campuspath;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
